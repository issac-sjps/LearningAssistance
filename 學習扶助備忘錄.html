<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教務/排課備忘錄</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .task-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* 預設狀態 (未完成 - 紅色背景) */
        .task {
            background-color: #ffeaea; /* 淡紅色 */
            border: 1px solid #ffb3b3;
            border-left: 8px solid #ff4d4d;
            border-radius: 8px;
            padding: 15px 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        /* 完成狀態 (綠色背景) */
        .task.completed {
            background-color: #eafbee; /* 淡綠色 */
            border: 1px solid #b3f0c3;
            border-left: 8px solid #28a745;
        }
        .task-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }
        .date-inputs {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group label {
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            width: 220px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        .hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>📝 學校事務提醒備忘錄</h1>
    <p style="text-align: center; color: #555;">輸入民國日期 (如: 1150226) 會自動轉換格式。<br>填寫「完成日期」即可將該項目標示為完成（轉為綠色）。</p>

    <div class="task-container">
        <div class="task" id="task1">
            <div class="task-title">1. 暑假開課申請</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>

        <div class="task" id="task2">
            <div class="task-title">2. 上學期開課申請</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>

        <div class="task" id="task3">
            <div class="task-title">3. 成長測驗日期</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>

        <div class="task" id="task4">
            <div class="task-title">4. 寒假開課申請</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>

        <div class="task" id="task5">
            <div class="task-title">5. 上學期開課申請</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>

        <div class="task" id="task6">
            <div class="task-title">6. 篩選測驗日期</div>
            <div class="date-inputs">
                <div class="input-group">
                    <label>到期日期:</label>
                    <input type="text" class="date-input due-date" placeholder="例如: 1150226">
                </div>
                <div class="input-group">
                    <label>完成日期:</label>
                    <input type="text" class="date-input completion-date" placeholder="例如: 1150226">
                </div>
            </div>
        </div>
    </div>

    <script>
        // 處理民國日期轉換 (格式: 1150226 -> 115年02月26日 星期X)
        function formatROCDate(inputStr) {
            // 檢查是否為剛好 7 位數的純數字
            const regex = /^(\d{3})(\d{2})(\d{2})$/;
            if (regex.test(inputStr)) {
                const match = inputStr.match(regex);
                const rocYear = parseInt(match[1]);
                const month = parseInt(match[2]);
                const day = parseInt(match[3]);
                
                // 轉換為西元年以取得星期幾 (西元年 = 民國年 + 1911)
                const gregorianYear = rocYear + 1911;
                const dateObj = new Date(gregorianYear, month - 1, day);
                
                // 檢查日期是否有效 (避免輸入 1150231 這種不存在的日期)
                if (dateObj.getFullYear() === gregorianYear && dateObj.getMonth() === month - 1 && dateObj.getDate() === day) {
                    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    const weekdayStr = weekdays[dateObj.getDay()];
                    
                    return `${rocYear}年${String(month).padStart(2, '0')}月${String(day).padStart(2, '0')}日 (${weekdayStr})`;
                }
            }
            // 如果格式不符或日期無效，則返回原本的輸入內容
            return inputStr;
        }

        // 為所有日期輸入框加上事件監聽器
        document.querySelectorAll('.date-input').forEach(input => {
            // 當輸入框失去焦點 (點擊外面或按下 Tab) 時觸發
            input.addEventListener('blur', function() {
                // 自動轉換日期格式
                this.value = formatROCDate(this.value.trim());

                // 如果是「完成日期」的輸入框，檢查是否為空來切換顏色
                if (this.classList.contains('completion-date')) {
                    const taskDiv = this.closest('.task');
                    if (this.value !== '') {
                        // 有填寫完成日期，加上 completed class (變綠色)
                        taskDiv.classList.add('completed');
                    } else {
                        // 清空完成日期，移除 completed class (變回紅色)
                        taskDiv.classList.remove('completed');
                    }
                }
            });

            // 按下 Enter 鍵也觸發 blur 效果
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    this.blur();
                }
            });
        });
    </script>
</body>
</html>
